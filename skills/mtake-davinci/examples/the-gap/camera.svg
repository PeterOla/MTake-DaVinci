<svg xmlns="http://www.w3.org/2000/svg" width="860" height="500" viewBox="0 0 860 500">
<title>The Gap | continuous camera plan</title>
<desc>Plan view. A virtual camera starts south-west of the first tile, pulls up and back to reveal the complete row, then moves toward the gap. Arrows show each sightline and labels give equivalent viewing heights.</desc>
<defs><marker id="tip" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="8" markerHeight="7" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#bce2d6"/></marker></defs>
<rect width="860" height="500" fill="#191c20"/><g fill="#eee6d7" font-family="sans-serif"><text x="38" y="47" font-size="25">The Gap · one tabletop, one continuous view</text><text x="38" y="75" font-size="15">Plan view · camera positions schematic for an orthographic lens · tile height 1.8 drawing units</text></g>
<rect x="84" y="112" width="690" height="141" rx="5" fill="#3a342f" stroke="#978779"/><g fill="#d9c39f"><rect x="204" y="160" width="9" height="33"/><rect x="271" y="160" width="9" height="33"/><rect x="338" y="160" width="9" height="33"/><rect x="405" y="160" width="9" height="33"/><rect x="561" y="160" width="9" height="33"/></g><g font-family="sans-serif" font-size="15" fill="#f3e8d6"><text x="105" y="140">Benchmark: front rail stays visible</text><text x="438" y="213">long gap</text><text x="568" y="160">last tile</text></g>
<g fill="none" stroke="#bce2d6" stroke-width="2" marker-end="url(#tip)"><path d="M116 329L225 195"/><path d="M256 389L353 196"/><path d="M420 345L492 199"/><path d="M110 338Q169 383 247 392Q329 392 412 351" stroke-width="4"/></g><g fill="#bce2d6"><circle cx="110" cy="338" r="6"/><circle cx="250" cy="393" r="6"/><circle cx="416" cy="350" r="6"/></g>
<g fill="#eee6d7" font-family="sans-serif" font-size="15"><text x="48" y="310">0 s · 24° elevation</text><text x="152" y="424">2.3 s · wider, 38° elevation</text><text x="436" y="345">6.6–9 s · gap, same elevation</text><text x="38" y="468">Follow the row. Reveal the fifth tile standing. End with the interval and the last fallen tile together.</text></g></svg>
